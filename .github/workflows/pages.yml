name: Publicar Natus no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'ChatBoot/index.html'
      - 'ChatBoot/publicar/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: natus-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter arquivos
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Preparar demonstração
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/ChatBoot/interface
          cp -a ChatBoot/publicar/{index.html,css,js,assets} site/ChatBoot/interface/
          sed 's|\./publicar/index.html|./ChatBoot/interface/index.html|g' ChatBoot/index.html > site/index.html
          sed 's|\./publicar/index.html|./interface/index.html|g' ChatBoot/index.html > site/ChatBoot/index.html
          touch site/.nojekyll
          test -s site/index.html
          test -s site/ChatBoot/interface/index.html
      - name: Empacotar demonstração
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar demonstração
        id: deployment
        uses: actions/deploy-pages@v4
